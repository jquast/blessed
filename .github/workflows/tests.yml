name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
  schedule:
    # Every Thursday at 1 AM
    - cron: '0 1 * * 4'

jobs:

  Tests:

    continue-on-error: ${{ matrix.optional || false }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    container: ${{ !startsWith(matrix.os, 'windows') && (matrix.container || format('python:{0}', matrix.python-version)) || null }}
    name: ${{ matrix.label || matrix.python-version }} ${{ startsWith(matrix.os, 'windows') && '(Windows)' || '' }} ${{ matrix.optional && '[OPTIONAL]' }}

    strategy:
      fail-fast: false
      matrix:
        python-version:  ['3.9', '3.10', '3.11', '3.12', '3.13']
        test_quick: [1]

        include:
          # exceptions .. Run full tests on latest two stable Python releases (slower)
          - python-version: '3.14'
            test_keyboard: 1
            test_raw: 1
            test_quick: 0

          - python-version: '3.15'
            test_keyboard: 1
            test_raw: 1
            test_quick: 0

          # Then, run docformatter on latest stable
          - python-version: '3.15'
            label: docformatter
            toxenv: docformatter_check
            os-deps:
              - enchant-2

          # all other linting tools on latest stable
          - python-version: '3.15'
            label: Linting
            toxenv: flake8,flake8_tests,isort_check,mypy,sphinx,pydocstyle,pylint,pylint_tests,codespell

          # windows testing,
          - python-version: '3.15'
            os: windows-latest
            test_quick: 0

          # python release candidate testing
          - python-version: '3.16'
            container: 'python:3.16-rc'
            optional: true
            test_quick: 0

    env:
      TEST_QUICK: ${{ matrix.test_quick || 0 }}
      TEST_KEYBOARD: ${{ matrix.test_keyboard || 0 }}
      TEST_RAW: ${{ matrix.test_raw || 0 }}
      TOXPYTHON: python${{ matrix.toxpython || matrix.python-version }}

    steps:

      - name: Set TOXENV
        shell: bash
        run: |
          if [ -n "${{ matrix.toxenv }}" ]; then
            echo "TOXENV=${{ matrix.toxenv }}" >> "$GITHUB_ENV"
          else
            echo "TOXENV=py$(echo '${{ matrix.python-version }}' | tr -d '.')" >> "$GITHUB_ENV"
          fi

      - name: Install OS Dependencies
        run: apt update && apt -y install ${{ join(matrix.os-deps, ' ') }}
        if: ${{ matrix.os-deps }}

      - uses: actions/checkout@v7

      - name: Install tox
        run: pip install tox

      - name: Collect terminal information
        run: tox -e about

      - name: Run tox
        run: tox

      - name: Upload to Codecov
        if: ${{ matrix.label != 'Linting' && matrix.label != 'docformatter' }}
        uses: codecov/codecov-action@v7
        with:
          verbose: true
          name: ${{ matrix.label || matrix.python-version }} ${{ startsWith(matrix.os, 'windows') && '(Windows)' || '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          os: ${{ startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}
          env_vars: TOXENV,TEST_QUICK,TEST_KEYBOARD,TEST_RAW

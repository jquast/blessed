name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip

      - name: Install dependencies
        run: |
          python -Im pip install --upgrade pip
          python -Im pip install -e .
          python -Im pip install pytest pytest-codspeed

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          TEST_BENCHMARK: 1
        with:
          mode: simulation
          run: pytest tests/test_benchmarks.py --codspeed -o "addopts="
